<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Primeira Página</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 2rem;
            text-align: center;
            border-radius: 8px;
        }

        main {
            max-width: 800px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background-color: #2980b9;
        }

        footer {
            text-align: center;
            margin-top: 30px;
            font-size: 0.9em;
            color: #777;
        }
    </style>
</head>
<body>

    <header>
        <h1>Natan Paulo</h1>
        <p>Um exemplo básico de página HTML5.</p>
    </header>

    <main>
        <section>
            <h2>Sobre este projeto</h2>
            <p>Este é um modelo inicial que você pode editar para criar seu próprio site, portfólio ou blog.</p>
            
            <button onclick="mostrarMensagem()">Clique aqui</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 - Desenvolvido por Você</p>
    </footer>

    <script>
        function mostrarMensagem() {
            alert("Olá! O JavaScript está funcionando perfeitamente.");
        }
    </script>

</body>
</html>
